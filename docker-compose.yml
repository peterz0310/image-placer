services:
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "${PROD_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
